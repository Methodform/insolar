<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кирпичный дом — low-poly 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#dfe7ec}
  #c{display:block;width:100%;height:100%}
  .panel{position:absolute;left:20px;top:20px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    border-radius:12px;padding:14px 18px;box-shadow:0 4px 18px rgba(0,0,0,.15);max-width:300px}
  .panel h1{margin:0 0 4px;font-size:17px;color:#2b3138}
  .panel p{margin:2px 0;font-size:12px;color:#5a636d}
  .panel .hint{margin-top:8px;font-size:11px;color:#8a939d}
  .btns{position:absolute;left:20px;bottom:20px;display:flex;gap:8px}
  .btns button{border:0;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;
    background:rgba(255,255,255,.9);color:#2b3138;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .btns button.active{background:#2b3138;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>Кирпичный дом (low-poly)</h1>
  <p>Одноэтажный, с деревянной отделкой фасада</p>
  <p>13,75 × 13,75 м · высота 6,5 м</p>
  <p class="hint">🖱 вращение — мышью, зум — колесом</p>
</div>
<div class="btns">
  <button id="rot" class="active">Авто-вращение</button>
  <button id="top">Вид сверху</button>
  <button id="front">Фасад</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
(function(){
  const cv=document.createElement('canvas');cv.width=16;cv.height=256;
  const g=cv.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#a8c4dc');gr.addColorStop(.55,'#dce8f0');gr.addColorStop(1,'#eef2f4');
  g.fillStyle=gr;g.fillRect(0,0,16,256);
  scene.background=new THREE.CanvasTexture(cv);
})();
scene.fog = new THREE.Fog(0xdce8f0, 70, 160);

const camera = new THREE.PerspectiveCamera(45, 2, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xcfe4f5, 0x8a8f7d, .6));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
sun.position.set(18, 26, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-25; sun.shadow.camera.right=25;
sun.shadow.camera.top=25;  sun.shadow.camera.bottom=-25;
sun.shadow.camera.far=80;  sun.shadow.bias=-0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd4e6,.3); fill.position.set(-15,10,-12); scene.add(fill);

/* ============ плоские материалы (без текстур) ============ */
const M = {
  brick:  new THREE.MeshStandardMaterial({color:0x99473a, roughness:.9}),
  roof:   new THREE.MeshStandardMaterial({color:0x41464d, roughness:.85, flatShading:true}),
  ridge:  new THREE.MeshStandardMaterial({color:0x2b2f34, roughness:.7}),
  trim:   new THREE.MeshStandardMaterial({color:0xc9a36b, roughness:.85}),   // деревянная обвязка
  slats:  new THREE.MeshStandardMaterial({color:0xbe9159, roughness:.85}),   // рейки крыльца
  deckC:  new THREE.MeshStandardMaterial({color:0xa87f4f, roughness:.9}),
  frame:  new THREE.MeshStandardMaterial({color:0x272b30, roughness:.55, metalness:.2}),
  glass:  new THREE.MeshPhongMaterial({color:0x33474f, specular:0xcfe0ee, shininess:160, transparent:true, opacity:.95}),
  dark:   new THREE.MeshStandardMaterial({color:0x2e3338, roughness:.6}),
  plinth: new THREE.MeshStandardMaterial({color:0x8d8d89, roughness:.95}),
  ground: new THREE.MeshStandardMaterial({color:0xb9c0b4, roughness:1})
};

const house = new THREE.Group(); scene.add(house);
function box(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;house.add(m);return m;
}

const ground = new THREE.Mesh(new THREE.CircleGeometry(90,48), M.ground);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

/* ============ габариты (натуральные метры) ============
   кровля 13.75×13.75 (габарит дома), стены 12.35, конёк 6.16, дымоход до ~6.5 */
const Y0=.2;               // верх цоколя
const WH=3.0;              // высота стен
const HALF=6.175;          // полустена 12.35
const NX0=0.8, NX1=5.0;    // ниша крыльца по x
const NZ=3.6;              // глубина ниши (задняя стенка)

/* цоколь */
box(12.55,.25,12.55,M.plinth,0,.125,0);

/* стены: квадрат с вырезом-нишей на фронте (+z) */
(function(){
  // экструзия с rotation.x=-90° отображает y-форму в -z: ниша на фронте (+z) задаётся при y<0
  const s=new THREE.Shape();
  s.moveTo(-HALF,HALF); s.lineTo(HALF,HALF); s.lineTo(HALF,-HALF);
  s.lineTo(NX1,-HALF); s.lineTo(NX1,-NZ); s.lineTo(NX0,-NZ); s.lineTo(NX0,-HALF);
  s.lineTo(-HALF,-HALF); s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:WH,bevelEnabled:false});
  const m=new THREE.Mesh(g,M.brick);
  m.rotation.x=-Math.PI/2; m.position.y=Y0;
  m.castShadow=true; m.receiveShadow=true; house.add(m);
})();

/* кирпичные пилоны по краям крыльца */
box(.45,WH,.45,M.brick,1.05,Y0+WH/2,5.9);
box(.45,WH,.45,M.brick,4.75,Y0+WH/2,5.9);

/* потолок-софит (дерево) — закрывает нишу и свесы снизу */
const sof=box(13.45,.07,13.45,M.trim,0,Y0+WH+.1,0); sof.castShadow=false;

/* деревянная обвязка по периметру свеса */
(function(){
  const t=.18,hh=.34,W=13.75,y=Y0+WH+.16;
  box(W,hh,t,M.trim,0,y, W/2-t/2);
  box(W,hh,t,M.trim,0,y,-W/2+t/2);
  box(t,hh,W,M.trim,-W/2+t/2,y,0);
  box(t,hh,W,M.trim, W/2-t/2,y,0);
})();

/* вальмовая крыша (почти пирамида) */
(function(){
  const W=13.75,h=2.7,cap=.6,y=Y0+WH+.26;
  const g=new THREE.BufferGeometry();
  const b=[[-W/2,0,W/2],[W/2,0,W/2],[W/2,0,-W/2],[-W/2,0,-W/2]];
  const t=[[-cap/2,h,cap/2],[cap/2,h,cap/2],[cap/2,h,-cap/2],[-cap/2,h,-cap/2]];
  const pos=[];
  const quad=(p1,p2,p3,p4)=>{pos.push(...p1,...p2,...p3, ...p1,...p3,...p4);};
  quad(b[0],b[1],t[1],t[0]); quad(b[1],b[2],t[2],t[1]);
  quad(b[2],b[3],t[3],t[2]); quad(b[3],b[0],t[0],t[3]);
  pos.push(...t[0],...t[1],...t[2], ...t[0],...t[2],...t[3]);
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,M.roof);
  m.position.y=y; m.castShadow=true; m.receiveShadow=true; house.add(m);
  box(.8,.1,.8,M.ridge,0,y+h+.03,0);
})();

/* дымоход */
box(.95,3.3,.75,M.brick,2.6,4.8,-2.4);
box(1.15,.14,.95,M.dark,2.6,6.45,-2.4);

/* ============ крыльцо-ниша ============ */
/* рейки (панель) на задней стенке ниши */
box(4.2,2.9,.06,M.slats,2.9- .0,Y0+1.45,NZ+.04);
/* раздвижная дверь + окно на панели */
function glazing(x,y,z,w,h,rot,divs=1){
  const gr=new THREE.Group();
  const fd=.12, ft=.09;
  const mk=(bw,bh,px,py)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,fd),M.frame);
    m.position.set(px,py,0);m.castShadow=true;gr.add(m);};
  mk(w,ft,0,h/2-ft/2); mk(w,ft,0,-h/2+ft/2);
  mk(ft,h,-w/2+ft/2,0); mk(ft,h,w/2-ft/2,0);
  for(let i=1;i<=divs;i++) if(i<divs+1&&divs>1) mk(.06,h-.1,-w/2+i*w/divs,0);
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(w-.12,h-.12),M.glass);
  gl.position.z=.01;gr.add(gl);
  gr.position.set(x,y,z); gr.rotation.y=[0,Math.PI/2,Math.PI,-Math.PI/2][rot];
  house.add(gr); return gr;
}
glazing(3.6,Y0+1.4,NZ+.12,2.3,2.5,0,2);   // раздвижная дверь
glazing(1.75,Y0+1.5,NZ+.12,1.3,1.4,0,1);  // окно у двери
/* деревянный настил в нише + ступень */
box(4.1,.12,2.5,M.deckC,2.9,Y0-.02,4.85);
box(3.2,.14,1.0,M.deckC,2.9,.07,6.6);
/* светильники */
[[1.35,5.92],[4.45,5.92]].forEach(([x,z])=>{
  const l=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.24,8),M.frame);
  l.position.set(x,Y0+2.2,z+.15);house.add(l);
});

/* ============ окна по фасадам ============ */
/* фронт, слева от крыльца */
glazing(-4.3,Y0+1.95,HALF+.06,1.6,1.5,0,2);
glazing(-1.6,Y0+1.95,HALF+.06,1.6,1.5,0,2);
/* правый фасад */
[-3.5,0,3.5].forEach(z=>glazing(HALF+.06,Y0+1.95,z,1.7,1.5,1,2));
/* задний фасад */
[-3.5,0,3.5].forEach(x=>glazing(x,Y0+1.95,-HALF-.06,1.7,1.5,2,2));
/* левый фасад */
[-3.5,.2,3.8].forEach(z=>glazing(-HALF-.06,Y0+1.95,z,1.7,1.5,3,2));

/* водосточные трубы по углам */
[[6.05,6.05],[6.05,-6.05],[-6.05,6.05],[-6.05,-6.05]].forEach(([x,z])=>{
  const p=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,WH+.2,8),M.dark);
  p.position.set(x,(WH+.2)/2+.1,z);p.castShadow=true;house.add(p);
});

/* ============ камера / управление ============ */
let theta=.65, phi=1.12, radius=30, autoRot=true;
const target=new THREE.Vector3(0,2.2,0);
function updCam(){
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
let drag=false,px=0,py=0;
canvas.addEventListener('pointerdown',e=>{drag=true;autoRot=false;rotBtn.classList.remove('active');px=e.clientX;py=e.clientY;});
addEventListener('pointermove',e=>{if(!drag)return;
  theta-=(e.clientX-px)*.006; phi-=(e.clientY-py)*.006;
  phi=Math.max(.12,Math.min(1.52,phi)); px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();
  radius*=1+e.deltaY*.0012; radius=Math.max(9,Math.min(90,radius));},{passive:false});

const rotBtn=document.getElementById('rot');
rotBtn.onclick=()=>{autoRot=!autoRot;rotBtn.classList.toggle('active',autoRot);};
document.getElementById('top').onclick=()=>{autoRot=false;rotBtn.classList.remove('active');phi=.25;theta=.65;radius=34;};
document.getElementById('front').onclick=()=>{autoRot=false;rotBtn.classList.remove('active');phi=1.35;theta=0;radius=26;};

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

(function loop(){
  requestAnimationFrame(loop);
  if(autoRot) theta+=.0028;
  updCam();
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
